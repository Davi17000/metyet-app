# Runs MetYet's own verification on every pull request into main. It tests;
# it never deploys, publishes, migrates or reads a secret. Production stays a
# manual Render deploy, and GitHub Pages stays deploy.yml's job alone.
#
# Everything runs in-process: Postgres is PGlite, the identity provider and
# Supabase are stubs, and no suite launches a browser (the Chrome harnesses
# under harness/ are run by hand and are not part of `npm test`).

name: Test

on:
  pull_request:
    branches: [main]

# Read the code; nothing else. No token scope to write, comment or deploy.
permissions:
  contents: read

# A newer push to the same PR cancels the older run.
concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Several suites compare against named historical commits
          # (git diff / git show <sha>), so a shallow clone would fail them.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22        # what Render runs (render.yaml NODE_VERSION)
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Tests read the app from dist/ and refuse to run against a stale one.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Production bundle
        run: npm run prod

      - name: Smoke
        run: npm run smoke
